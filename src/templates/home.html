<style>

        html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 48;
        }
        .gaze-target {
            min-width: 120px;
            min-height: 120px;
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.05);
        }
        .mesh-bg {
            background-color: #fbf9f8;
            background-image: 
                radial-gradient(at 0% 0%, rgba(139, 186, 180, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(223, 216, 254, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(151, 180, 207, 0.15) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(188, 236, 229, 0.15) 0px, transparent 50%);
        }
        .premium-shadow {
            box-shadow: 
                0 10px 30px -10px rgba(0,0,0,0.05),
                0 40px 60px -15px rgba(0,0,0,0.03);
        }
        .intent-card {
            border-radius: 4rem;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .intent-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 30px 60px -12px rgba(0,0,0,0.08);
        }
        .cta-button {
            background: linear-gradient(135deg, #386661 0%, #2a4d49 100%);
            box-shadow: 0 20px 40px -10px rgba(56, 102, 97, 0.3);
        }
        .cta-button:hover {
            box-shadow: 0 30px 50px -10px rgba(56, 102, 97, 0.4);
        }
    </style>
